<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" role="img" aria-labelledby="title desc">
  <title id="title">Domine o Jogo — curso intensivo</title>
  <desc id="desc">Capa premium do curso de eFootball com tema vermelho e preto, tática, gameplay e evolução.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050608"/>
      <stop offset=".52" stop-color="#0a0b0e"/>
      <stop offset="1" stop-color="#16070b"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="38%" r="48%">
      <stop offset="0" stop-color="#ff2037" stop-opacity=".48"/>
      <stop offset=".35" stop-color="#ff2037" stop-opacity=".18"/>
      <stop offset="1" stop-color="#ff2037" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4054"/>
      <stop offset=".55" stop-color="#ff102d"/>
      <stop offset="1" stop-color="#b9071b"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".55" stop-color="#f1f3f6"/>
      <stop offset="1" stop-color="#aeb4bd"/>
    </linearGradient>
    <filter id="redGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="24"/></filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity=".025" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1000" height="1250" rx="48" fill="url(#bg)"/>
  <rect width="1000" height="1250" rx="48" fill="url(#grid)"/>
  <ellipse cx="520" cy="360" rx="430" ry="360" fill="url(#halo)"/>
  <path d="M-100 410C220 300 580 330 1100 190" fill="none" stroke="#ff2037" stroke-width="4" opacity=".44"/>
  <path d="M-100 435C240 330 590 365 1100 235" fill="none" stroke="#ff2037" stroke-width="1.8" opacity=".25"/>
  <circle cx="820" cy="220" r="130" fill="#ff2037" opacity=".06" filter="url(#soft)"/>

  <!-- Top labels -->
  <g transform="translate(64 58)">
    <rect width="292" height="54" rx="27" fill="#0d0f12" stroke="#ff2037" stroke-width="2"/>
    <circle cx="28" cy="27" r="7" fill="#ff2037" filter="url(#redGlow)"/>
    <text x="52" y="35" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" letter-spacing="2">DISPONÍVEL AGORA</text>
  </g>
  <text x="936" y="75" text-anchor="end" fill="#9fa5af" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" letter-spacing="6">ÍTALO FOOTBALL</text>

  <!-- Tactical board -->
  <g transform="translate(642 132) rotate(5 150 145)" opacity=".78">
    <rect width="292" height="286" rx="24" fill="#0a0c0f" stroke="#ff2037" stroke-width="3"/>
    <rect x="25" y="24" width="242" height="238" rx="8" fill="none" stroke="#ff4054" stroke-width="2" opacity=".72"/>
    <line x1="146" y1="24" x2="146" y2="262" stroke="#ff4054" stroke-width="2" opacity=".72"/>
    <circle cx="146" cy="143" r="42" fill="none" stroke="#ff4054" stroke-width="2" opacity=".72"/>
    <g fill="none" stroke="#ff4054" stroke-width="6" stroke-linecap="round">
      <path d="M64 87l16 16m0-16-16 16M196 76l16 16m0-16-16 16M72 208l16 16m0-16-16 16"/>
    </g>
    <g fill="#0a0c0f" stroke="#ff4054" stroke-width="5"><circle cx="112" cy="92" r="10"/><circle cx="214" cy="173" r="10"/><circle cx="116" cy="192" r="10"/></g>
    <path d="M88 185c24-12 45-27 58-49m0 0-8 5m8-5-1 10M175 151c18 5 32 17 39 34" fill="none" stroke="#ff2037" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Abstract controller -->
  <g transform="translate(58 270) rotate(-8)" opacity=".88">
    <path d="M42 50c-18 8-29 31-35 61l-13 74c-5 29 23 46 45 26l42-38h94l42 38c22 20 50 3 45-26l-13-74c-6-30-17-53-35-61-30-13-56 5-65 24H107C98 55 72 37 42 50Z" fill="#090a0d" stroke="#ff2037" stroke-width="4"/>
    <path d="M57 104h42M78 83v42" stroke="#fff" stroke-width="9" stroke-linecap="round" opacity=".86"/>
    <circle cx="198" cy="99" r="8" fill="#ff2037"/><circle cx="220" cy="121" r="8" fill="#fff"/><circle cx="220" cy="77" r="8" fill="#ff2037"/><circle cx="242" cy="99" r="8" fill="#fff"/>
  </g>

  <!-- Ball / brand mark -->
  <g transform="translate(430 185)">
    <circle cx="80" cy="80" r="76" fill="#090a0d" stroke="url(#red)" stroke-width="7" filter="url(#redGlow)"/>
    <path d="M80 29 103 46 94 74 66 74 57 46Z" fill="#ff2037"/>
    <path d="M57 46 31 58 26 87 49 104 66 74M103 46l26 12 5 29-23 17-17-30M49 104l9 28 22 15 22-15 9-28M80 147v22" fill="none" stroke="#d9dde3" stroke-width="5" stroke-linejoin="round" opacity=".9"/>
  </g>

  <!-- Main heading -->
  <text x="500" y="520" text-anchor="middle" fill="#ff4b60" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="900" letter-spacing="12">CURSO INTENSIVO</text>
  <text x="500" y="652" text-anchor="middle" fill="url(#silver)" font-family="Arial,Helvetica,sans-serif" font-size="132" font-style="italic" font-weight="900" letter-spacing="-7">DOMINE</text>
  <text x="500" y="772" text-anchor="middle" fill="url(#red)" font-family="Arial,Helvetica,sans-serif" font-size="124" font-style="italic" font-weight="900" letter-spacing="-7">O JOGO.</text>
  <text x="500" y="830" text-anchor="middle" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="32" font-style="italic" font-weight="800" letter-spacing="9">SEJA A DIFERENÇA.</text>
  <line x1="354" y1="864" x2="646" y2="864" stroke="#ff2037" stroke-width="5" stroke-linecap="round"/>
  <text x="500" y="918" text-anchor="middle" fill="#d6dae0" font-family="Arial,Helvetica,sans-serif" font-size="29" font-style="italic">Como jogar bem com <tspan fill="#ff4054" font-weight="900">Ítalo eFootball</tspan></text>

  <!-- Benefits -->
  <g transform="translate(64 970)">
    <g>
      <rect width="268" height="132" rx="24" fill="#0b0d11" stroke="#ff2037" stroke-opacity=".55"/>
      <circle cx="42" cy="42" r="24" fill="#ff2037" fill-opacity=".1" stroke="#ff2037"/>
      <path d="M31 51c9-17 22-24 35-21m-1 0-7-2m7 2-3 7" fill="none" stroke="#ff4054" stroke-width="4" stroke-linecap="round"/>
      <text x="28" y="94" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="800">Táticas avançadas</text>
      <text x="28" y="117" fill="#8e949e" font-family="Arial,Helvetica,sans-serif" font-size="14">Decida melhor em campo</text>
    </g>
    <g transform="translate(302 0)">
      <rect width="268" height="132" rx="24" fill="#0b0d11" stroke="#ff2037" stroke-opacity=".55"/>
      <circle cx="42" cy="42" r="24" fill="#ff2037" fill-opacity=".1" stroke="#ff2037"/>
      <rect x="25" y="34" width="34" height="20" rx="8" fill="none" stroke="#ff4054" stroke-width="3"/><circle cx="50" cy="44" r="2.5" fill="#fff"/><path d="M34 40v8m-4-4h8" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
      <text x="28" y="94" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="800">Gameplay consciente</text>
      <text x="28" y="117" fill="#8e949e" font-family="Arial,Helvetica,sans-serif" font-size="14">Jogue com mais controle</text>
    </g>
    <g transform="translate(604 0)">
      <rect width="268" height="132" rx="24" fill="#0b0d11" stroke="#ff2037" stroke-opacity=".55"/>
      <circle cx="42" cy="42" r="24" fill="#ff2037" fill-opacity=".1" stroke="#ff2037"/>
      <path d="M28 54V42h8v12m7 0V34h8v20m7 0V25h8v29" fill="none" stroke="#ff4054" stroke-width="4"/>
      <text x="28" y="94" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="800">Evolução constante</text>
      <text x="28" y="117" fill="#8e949e" font-family="Arial,Helvetica,sans-serif" font-size="14">Construa consistência</text>
    </g>
  </g>

  <text x="500" y="1170" text-anchor="middle" fill="#9ca2ab" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" letter-spacing="7">O SEU PRÓXIMO NÍVEL COMEÇA AQUI</text>
  <line x1="110" y1="1164" x2="260" y2="1164" stroke="#ff2037" stroke-width="3"/><line x1="740" y1="1164" x2="890" y2="1164" stroke="#ff2037" stroke-width="3"/>
  <rect x="1.5" y="1.5" width="997" height="1247" rx="47" fill="none" stroke="#ffffff" stroke-opacity=".09" stroke-width="3"/>
</svg>