<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" role="img" aria-labelledby="title desc">
  <title id="title">Ítalo Football</title>
  <desc id="desc">Logo horizontal única da Ítalo Football em vermelho, branco e preto.</desc>
  <defs>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3850"/>
      <stop offset=".5" stop-color="#ff102d"/>
      <stop offset="1" stop-color="#b9081c"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#f2f4f7"/>
      <stop offset="1" stop-color="#b9bec7"/>
    </linearGradient>
    <radialGradient id="badge" cx="50%" cy="42%" r="64%">
      <stop offset="0" stop-color="#2b1016"/>
      <stop offset=".62" stop-color="#0c0d10"/>
      <stop offset="1" stop-color="#040507"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g transform="translate(16 16)">
    <circle cx="112" cy="114" r="99" fill="#050608" stroke="#310a11" stroke-width="8"/>
    <circle cx="112" cy="114" r="86" fill="url(#badge)" stroke="url(#red)" stroke-width="7" filter="url(#glow)"/>
    <path d="M112 62 128 87 158 94 138 117 141 149 112 136 83 149 86 117 66 94 96 87Z" fill="none" stroke="#ff2037" stroke-width="7" stroke-linejoin="round" opacity=".92"/>
    <circle cx="112" cy="114" r="22" fill="#08090b" stroke="#ff4054" stroke-width="5"/>
    <path d="M101 104 112 97 123 104 119 118 105 118Z" fill="#ff2037"/>
    <path d="M78 77 57 58M146 77l21-19M75 151l-23 20M149 151l23 20" stroke="#ff2037" stroke-width="5" stroke-linecap="round" opacity=".65"/>
  </g>

  <g transform="skewX(-8)">
    <text x="238" y="135" fill="url(#silver)" font-family="Arial,Helvetica,sans-serif" font-size="112" font-style="italic" font-weight="900" letter-spacing="-5">ÍTALO</text>
    <path d="M236 151H824" stroke="#ff2037" stroke-width="5" stroke-linecap="round" opacity=".9"/>
    <text x="258" y="202" fill="url(#red)" font-family="Arial,Helvetica,sans-serif" font-size="42" font-style="italic" font-weight="900" letter-spacing="18">FOOTBALL</text>
  </g>

  <path d="M807 55c54 8 98 31 122 60-24 34-68 57-124 65" fill="none" stroke="#ff2037" stroke-width="6" stroke-linecap="round" opacity=".76"/>
  <path d="M819 70c39 8 69 24 88 45-18 21-48 37-87 46" fill="none" stroke="#ff2037" stroke-width="2" stroke-linecap="round" opacity=".52"/>
</svg>